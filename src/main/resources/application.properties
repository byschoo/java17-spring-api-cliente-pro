spring.application.name=apirest-pro-studentdto

# BANNER
spring.banner.charset=UTF-8
spring.banner.location=classpath:my-banner.txt

# DEV: Server port
server.port=8092




# LOGS SETTING
# For all API, DEBUG must be activated in the development stage, never in production 
logging.level.root=INFO

# Only the Service Layer with Warn for example:
#logging.level.com.byschoo.apirest_pro_clientesdto.Service=Warn

# Logs Console Formatted / NO BANNER when active
#logging.structured.format.console=com.byschoo.apirest_pro_clientesdto.Logs.FormatJsonLogger
#logging.structured.format.console=com.byschoo.apirest_pro_clientesdto.Logs.FormatKeyValueLogger

# Logs File Formatted
#logging.structured.format.file=com.byschoo.apirest_pro_clientesdto.Logs.FormatJsonLogger
logging.structured.format.file=com.byschoo.apirest_pro_clientesdto.Logs.FormatKeyValueLogger


# Logs file
logging.file.name=server.log
#logging.level.ch.qos.logback=INFO




# DEV: Finding and reading .env file
spring.config.import=optional:secrets.properties




# DATABASE CONNECTIONS SETTINGS
# DEV: URL TO CONNECT WITH LOCAL POSTGRES (Localhost API)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DEV_DB_NAME}

# DEV: URL TO CONNECT WITH DOCKER CONTAINER POSTGRES (Localhost API) *STOPING LOCAL SERVICE POSTGRES
#spring.datasource.url=jdbc:postgresql://localhost:5433/${DEV_DB_NAME}

# DEV: URL TO CONNECT WITH DOCKER CONTAINER POSTGRES (Docker Container API)
#spring.datasource.url=jdbc:postgresql://my-postgres-container:5433/${DEV_DB_NAME}

