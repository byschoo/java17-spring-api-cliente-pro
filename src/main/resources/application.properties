# DATASOURCE VARIABLE CONNECTIONS
spring.datasource.username: ${DEV_DB_USERNAME}
spring.datasource.password: ${DEV_DB_PASSWORD}

# JPA & Hibernate settings
spring.jpa.show-sql=true
# Permite que Hibernate actualice automáticamente el esquema de la base de datos a medida que realizas cambios en tus entidades. No se recomienda para producción, ya que podría haber cambios inesperados en el esquema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# CONFIG SPRINGDOC OPENAPI SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger.ui.custom.html


